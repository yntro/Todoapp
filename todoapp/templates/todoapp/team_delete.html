<!DOCTYPE html>
{% extends "todoapp/base.html" %}
{% block title %}Delete {{ team }} {% endblock %}
{% block content %}
<div><a onclick="history.back()" class="btn btn-secondary mb-3">← Back</a></div>
    <div class="content-section">
        <form method="POST">
            {% csrf_token %}
            {% load crispy_forms_tags %}
            <fieldset class="form-group">
                <legend class="border-bottom mb-4">Delete team - {{ team }}</legend>
                <h2>Are you sure you want to delete?</h2>
                <div class="form-group">
                    <button class="btn btn-primary btn-danger" type="submit">Yes</button>
                    <a class="btn btn-primary" href="{% url 'my_tasks' %}">Cancel</a>
                </div>
            </fieldset>
        </form>
    </div>
{% endblock %}
