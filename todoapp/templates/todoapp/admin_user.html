{% extends "todoapp/base.html" %}
{% load crispy_forms_tags %}

{% block content %}

<h2>Edit {{ user.username }}</h2>

<div><a onclick="history.back()" class="btn btn-secondary mb-3">← Back</a></div>
<form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    {{ profile_form|crispy }}
    <button type="submit" class="btn btn-primary">
        Save
    </button>
</form>

{% endblock %}
