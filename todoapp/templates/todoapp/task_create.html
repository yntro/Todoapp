{% extends "todoapp/base.html" %}

{% block title %} Create new task {% endblock %}

{% block content %}
<a onclick="history.back()" class="btn btn-secondary mb-3">← Back</a>
    <div class="content-section">
        <form method="POST">
        {% csrf_token %}
        {% load crispy_forms_tags %}
            {{ form | crispy }}
        <div class="form-group">
            <button class="btn btn-secondary mb-3" type="submit">Save</button>
        </div>
        </form>
    </div>
{% endblock%}
